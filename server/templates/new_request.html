<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>New Request</title></head>
<body style="font-family:sans-serif;background:#f9fafb;margin:0;padding:24px">
<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:12px;padding:32px;border:1px solid #e5e7eb">
  <h1 style="color:#16a34a;font-size:20px;margin-bottom:8px">📬 Someone wants your item!</h1>
  <p style="color:#374151">Hi {{owner_name}},</p>
  <p style="color:#6b7280"><strong>{{requester_name}}</strong> has requested your listing: <strong>{{item_title}}</strong></p>
  <div style="text-align:center;margin:24px 0">
    <a href="{{app_url}}/dashboard/incoming-requests" style="background:#16a34a;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:600">Review Request</a>
  </div>
  <p style="color:#9ca3af;font-size:12px;text-align:center">{{app_name}} · <a href="{{app_url}}/privacy" style="color:#9ca3af">Privacy Policy</a></p>
</div>
</body></html>
