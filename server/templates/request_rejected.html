<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Request Update</title></head>
<body style="font-family:sans-serif;background:#f9fafb;margin:0;padding:24px">
<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:12px;padding:32px;border:1px solid #e5e7eb">
  <h1 style="color:#374151;font-size:20px;margin-bottom:8px">Update on your request</h1>
  <p style="color:#374151">Hi {{requester_name}},</p>
  <p style="color:#6b7280">Unfortunately, {{owner_name}} was unable to accept your request for <strong>{{item_title}}</strong> at this time. Don't worry — there are plenty of other items available near you!</p>
  <div style="text-align:center;margin:24px 0">
    <a href="{{app_url}}/explore" style="background:#16a34a;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:600">Browse More Items</a>
  </div>
  <p style="color:#9ca3af;font-size:12px;text-align:center">{{app_name}} · <a href="{{app_url}}/privacy" style="color:#9ca3af">Privacy Policy</a></p>
</div>
</body></html>
